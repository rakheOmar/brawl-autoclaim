name: Claim daily gift

on:
  schedule:
    # 08:10 UTC = 13:40 IST, ten minutes after the 13:30 IST reset.
    - cron: "10 8 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: daily-gift
  cancel-in-progress: false

jobs:
  claim:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.11"
      - name: Claim daily gifts
        env:
          SESSION_COOKIE: ${{ secrets.SESSION_COOKIE }}
          SC_STORE_Q: ${{ secrets.SC_STORE_Q }}
          SCSO_SCID: ${{ secrets.SCSO_SCID }}
          NEXT_LOCALE: en
        run: bun src/index.ts claim
